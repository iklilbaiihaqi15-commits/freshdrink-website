<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FreshDrink – Website Resep Minuman Segar</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* =========== RESET & GLOBAL =========== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal:    #3BBFAD;
      --teal-dk: #2a9e8d;
      --orange:  #F26522;
      --orange-dk:#d4541a;
      --white:   #FFFFFF;
      --light:   #F5F9F8;
      --gray:    #6B7280;
      --dark:    #1F2937;
      --card-bg: #FFFFFF;
      --star:    #F59E0B;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--light);
      color: var(--dark);
      min-height: 100vh;
    }

    /* =========== NAVBAR =========== */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--white);
      box-shadow: 0 2px 12px rgba(59,191,173,.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      height: 64px;
    }

    .nav-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      cursor: pointer;
    }

    .logo-badge {
      background: var(--teal);
      color: var(--white);
      font-family: 'Poppins', sans-serif;
      font-weight: 900;
      font-size: 14px;
      padding: 4px 8px;
      border-radius: 6px;
      letter-spacing: 1px;
    }

    .logo-text {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 20px;
      color: var(--dark);
    }

    .logo-text span { color: var(--teal); }

    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      color: var(--dark);
      transition: color .2s;
      cursor: pointer;
    }

    .nav-links a:hover,
    .nav-links a.active { color: var(--teal); }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-login {
      background: var(--teal);
      color: var(--white);
      border: none;
      padding: 8px 20px;
      border-radius: 20px;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background .2s, transform .15s;
    }

    .btn-login:hover {
      background: var(--teal-dk);
      transform: translateY(-1px);
    }

    /* =========== SEARCH BAR =========== */
    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      border: 2px solid #E5E7EB;
      border-radius: 24px;
      padding: 8px 16px 8px 38px;
      font-family: 'Nunito', sans-serif;
      font-size: 14px;
      width: 240px;
      outline: none;
      transition: border-color .2s, width .3s;
      color: var(--dark);
      background: #f9fafb;
    }

    .search-input:focus {
      border-color: var(--teal);
      width: 280px;
      background: var(--white);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      color: var(--gray);
      font-size: 15px;
      pointer-events: none;
    }

    .search-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      background: var(--white);
      border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
      overflow: hidden;
      z-index: 200;
      animation: fadeDown .2s ease;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .search-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      cursor: pointer;
      transition: background .15s;
    }

    .search-item:hover { background: #f3faf9; }

    .search-item img {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      object-fit: cover;
    }

    .search-item span {
      font-weight: 700;
      font-size: 13px;
      color: var(--dark);
    }

    /* =========== HERO / HOME =========== */
    .hero {
      background: linear-gradient(135deg, var(--teal) 0%, #2aada0 50%, #1e9087 100%);
      padding: 60px 40px 80px;
      position: relative;
      overflow: hidden;
    }

    .hero::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: rgba(255,255,255,.07);
      border-radius: 50%;
      top: -80px;
      right: -60px;
    }

    .hero::after {
      content: '';
      position: absolute;
      width: 200px;
      height: 200px;
      background: var(--orange);
      border-radius: 50%;
      bottom: -80px;
      left: 60px;
      opacity: .25;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 600px;
    }

    .hero h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 44px;
      font-weight: 900;
      color: var(--white);
      line-height: 1.15;
      margin-bottom: 16px;
    }

    .hero h1 span { color: #FFD166; }

    .hero p {
      color: rgba(255,255,255,.88);
      font-size: 16px;
      font-weight: 600;
      line-height: 1.6;
      margin-bottom: 32px;
      max-width: 480px;
    }

    .hero-search {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .hero-search .search-input {
      width: 340px;
      font-size: 15px;
      padding: 12px 16px 12px 42px;
    }

    /* =========== SECTION WRAPPER =========== */
    .section {
      max-width: 1100px;
      margin: 0 auto;
      padding: 48px 24px;
    }

    .section-title {
      font-family: 'Poppins', sans-serif;
      font-size: 26px;
      font-weight: 800;
      color: var(--dark);
      margin-bottom: 28px;
      position: relative;
      display: inline-block;
    }

    .section-title::after {
      content: '';
      display: block;
      height: 4px;
      width: 50px;
      background: var(--orange);
      border-radius: 4px;
      margin-top: 6px;
    }

    /* =========== CARDS GRID =========== */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 24px;
    }

    @media(max-width: 768px) {
      .cards-grid { grid-template-columns: repeat(2, 1fr); }
    }

    .drink-card {
      background: var(--card-bg);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
      cursor: pointer;
      transition: transform .25s, box-shadow .25s;
    }

    .drink-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 12px 32px rgba(59,191,173,.2);
    }

    .drink-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .card-body {
      padding: 14px 16px 16px;
    }

    .card-name {
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 15px;
      color: var(--dark);
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .card-stars {
      font-size: 14px;
      letter-spacing: 2px;
      color: var(--star);
    }

    /* =========== DETAIL PAGE =========== */
    .detail-page { background: var(--light); min-height: 100vh; }

    .detail-hero {
      background: linear-gradient(135deg, var(--teal) 0%, #2aada0 100%);
      padding: 40px;
      display: flex;
      gap: 40px;
      align-items: flex-start;
    }

    .detail-img-wrap {
      flex-shrink: 0;
      width: 300px;
      height: 240px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,.25);
    }

    .detail-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .detail-info { color: var(--white); }

    .detail-info h2 {
      font-family: 'Poppins', sans-serif;
      font-size: 32px;
      font-weight: 900;
      line-height: 1.2;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .detail-stars { font-size: 22px; letter-spacing: 3px; color: var(--star); margin-bottom: 14px; }

    .btn-back {
      background: rgba(255,255,255,.2);
      border: 2px solid rgba(255,255,255,.5);
      color: var(--white);
      padding: 8px 20px;
      border-radius: 20px;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background .2s;
    }

    .btn-back:hover { background: rgba(255,255,255,.35); }

    .detail-content {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media(max-width: 640px) { .detail-content { grid-template-columns: 1fr; } }

    .detail-box {
      background: var(--white);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 4px 18px rgba(0,0,0,.07);
    }

    .detail-box.full { grid-column: 1 / -1; }

    .box-title {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 17px;
      color: var(--white);
      background: var(--orange);
      display: inline-block;
      padding: 6px 18px;
      border-radius: 10px;
      margin-bottom: 16px;
    }

    .box-title.teal { background: var(--teal); }

    .detail-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .detail-list li {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-weight: 600;
      font-size: 14px;
      color: var(--dark);
      line-height: 1.5;
    }

    .detail-list li::before {
      content: '•';
      color: var(--orange);
      font-size: 18px;
      flex-shrink: 0;
      line-height: 1.2;
    }

    .step-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      margin-bottom: 14px;
    }

    .step-num {
      background: var(--teal);
      color: var(--white);
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 13px;
      flex-shrink: 0;
    }

    .step-text {
      font-weight: 600;
      font-size: 14px;
      color: var(--dark);
      line-height: 1.6;
      padding-top: 3px;
    }

    /* =========== MODAL LOGIN =========== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
      animation: fadeIn .2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .modal-box {
      background: var(--white);
      border-radius: 24px;
      padding: 40px 36px;
      width: 360px;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
      animation: popUp .25s cubic-bezier(.34,1.56,.64,1);
      position: relative;
    }

    @keyframes popUp {
      from { opacity: 0; transform: scale(.85); }
      to   { opacity: 1; transform: scale(1); }
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 20px;
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: var(--gray);
      line-height: 1;
    }

    .modal-close:hover { color: var(--dark); }

    .modal-title {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 24px;
      color: var(--dark);
      text-align: center;
      margin-bottom: 28px;
    }

    .modal-field {
      margin-bottom: 16px;
    }

    .modal-field input {
      width: 100%;
      border: 2px solid #E5E7EB;
      border-radius: 12px;
      padding: 12px 16px;
      font-family: 'Nunito', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color .2s;
      color: var(--dark);
    }

    .modal-field input:focus { border-color: var(--teal); }
    .modal-field input::placeholder { color: #9CA3AF; }

    .btn-enter {
      width: 100%;
      background: var(--teal);
      color: var(--white);
      border: none;
      padding: 13px;
      border-radius: 12px;
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      margin-top: 4px;
      transition: background .2s, transform .15s;
      letter-spacing: 1px;
    }

    .btn-enter:hover {
      background: var(--teal-dk);
      transform: translateY(-2px);
    }

    .modal-footer {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: var(--gray);
      font-weight: 600;
    }

    .modal-footer span {
      color: var(--teal);
      cursor: pointer;
      font-weight: 700;
    }

    .modal-footer span:hover { text-decoration: underline; }

    /* =========== ABOUT PAGE =========== */
    .about-hero {
      background: linear-gradient(135deg, var(--teal) 0%, #2aada0 100%);
      padding: 80px 40px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .about-hero::before {
      content: '';
      position: absolute;
      width: 250px; height: 250px;
      background: rgba(255,255,255,.08);
      border-radius: 50%;
      top: -60px; left: -60px;
    }

    .about-hero::after {
      content: '';
      position: absolute;
      width: 180px; height: 180px;
      background: var(--orange);
      border-radius: 50%;
      bottom: -60px; right: 80px;
      opacity: .3;
    }

    .about-hero h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 48px;
      font-weight: 900;
      color: var(--white);
      position: relative; z-index: 2;
      letter-spacing: 2px;
    }

    .about-body {
      max-width: 720px;
      margin: 0 auto;
      padding: 60px 24px;
      text-align: center;
    }

    .about-body p {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.9;
      color: var(--dark);
      position: relative;
    }

    .about-body p::before {
      content: '"';
      font-family: 'Poppins', sans-serif;
      font-size: 80px;
      color: var(--teal);
      opacity: .2;
      position: absolute;
      top: -30px; left: -20px;
      line-height: 1;
    }

    .about-badge {
      display: inline-block;
      background: var(--teal);
      color: var(--white);
      font-weight: 700;
      font-size: 13px;
      padding: 6px 18px;
      border-radius: 20px;
      margin-bottom: 24px;
      letter-spacing: 1px;
    }

    /* =========== KATEGORI PAGE =========== */
    .kategori-hero {
      background: linear-gradient(135deg, var(--teal) 0%, #2aada0 100%);
      padding: 60px 40px;
      text-align: center;
    }

    .kategori-hero h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 42px;
      font-weight: 900;
      color: var(--white);
      letter-spacing: 2px;
    }

    .kategori-grid {
      max-width: 900px;
      margin: 0 auto;
      padding: 48px 24px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 24px;
    }

    @media(max-width: 580px) { .kategori-grid { grid-template-columns: 1fr; } }

    .kat-card {
      background: var(--white);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
      transition: transform .25s, box-shadow .25s;
    }

    .kat-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 32px rgba(59,191,173,.2);
    }

    .kat-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
    }

    .kat-body { padding: 20px; }

    .kat-name {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 18px;
      color: var(--dark);
      margin-bottom: 8px;
    }

    .kat-desc {
      font-size: 13px;
      color: var(--gray);
      font-weight: 600;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .btn-selengkapnya {
      background: var(--orange);
      color: var(--white);
      border: none;
      padding: 8px 20px;
      border-radius: 20px;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: background .2s;
    }

    .btn-selengkapnya:hover { background: var(--orange-dk); }

    /* =========== FOOTER =========== */
    .footer {
      background: var(--dark);
      color: rgba(255,255,255,.7);
      text-align: center;
      padding: 24px;
      font-size: 14px;
      font-weight: 600;
    }

    .footer span { color: var(--teal); }

    /* =========== RATING STARS INTERACTIVE =========== */
    .rating-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .star-btn {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      transition: transform .15s;
    }

    .star-btn:hover { transform: scale(1.3); }

    /* =========== TOAST =========== */
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--dark);
      color: var(--white);
      padding: 12px 28px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 14px;
      z-index: 9999;
      animation: toastIn .3s ease;
      box-shadow: 0 8px 24px rgba(0,0,0,.2);
    }

    @keyframes toastIn {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* =========== ADMIN PAGE =========== */
    .admin-hero {
      background: linear-gradient(135deg, var(--dark) 0%, #374151 100%);
      padding: 60px 40px;
      text-align: center;
    }

    .admin-hero h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 42px;
      font-weight: 900;
      color: var(--white);
      letter-spacing: 2px;
    }

    .admin-body {
      max-width: 900px;
      margin: 0 auto;
      padding: 40px 24px 60px;
    }

    .admin-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 12px;
      flex-wrap: wrap;
    }

    .admin-toolbar-title {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 20px;
      color: var(--dark);
    }

    .btn-add {
      background: var(--teal);
      color: var(--white);
      border: none;
      padding: 10px 22px;
      border-radius: 20px;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background .2s, transform .15s;
    }

    .btn-add:hover { background: var(--teal-dk); transform: translateY(-1px); }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--white);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 18px rgba(0,0,0,.08);
    }

    .admin-table thead {
      background: var(--dark);
      color: var(--white);
    }

    .admin-table th {
      padding: 14px 18px;
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
      font-size: 13px;
      text-align: left;
      letter-spacing: 0.5px;
    }

    .admin-table td {
      padding: 12px 18px;
      font-size: 14px;
      font-weight: 600;
      color: var(--dark);
      border-bottom: 1px solid #F3F4F6;
      vertical-align: middle;
    }

    .admin-table tbody tr:last-child td { border-bottom: none; }
    .admin-table tbody tr:hover { background: #F9FAFB; }

    .admin-table td img {
      width: 48px;
      height: 40px;
      object-fit: cover;
      border-radius: 8px;
    }

    .btn-edit {
      background: rgba(59,191,173,.12);
      color: var(--teal-dk);
      border: none;
      padding: 6px 14px;
      border-radius: 14px;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      margin-right: 6px;
      transition: background .15s;
    }

    .btn-edit:hover { background: var(--teal); color: var(--white); }

    .btn-del {
      background: rgba(239,68,68,.1);
      color: #ef4444;
      border: none;
      padding: 6px 14px;
      border-radius: 14px;
      font-family: 'Nunito', sans-serif;
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      transition: background .15s;
    }

    .btn-del:hover { background: #ef4444; color: var(--white); }

    .admin-locked {
      max-width: 480px;
      margin: 80px auto;
      text-align: center;
      padding: 0 24px;
    }

    .admin-locked-icon { font-size: 56px; margin-bottom: 16px; }

    .admin-locked h2 {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 24px;
      color: var(--dark);
      margin-bottom: 10px;
    }

    .admin-locked p {
      font-size: 15px;

    function LoginModal({ onClose, onSuccess }) {
      const [email, setEmail] = useState("");
      const [pass, setPass] = useState("");
      const [err, setErr] = useState("");

      const handleEnter = () => {
        if (!email || !pass) { setErr("Email dan password harus diisi!"); return; }
        if (!email.includes("@")) { setErr("Format email tidak valid!"); return; }
        onSuccess();
      };

      return (
        <div className="modal-overlay" onClick={(e) => { if(e.target===e.currentTarget) onClose(); }}>
          <div className="modal-box">
            <button className="modal-close" onClick={onClose}>✕</button>
            <div className="modal-title">LOG IN</div>

            <div className="modal-field">
              <input
                type="email"
                placeholder="email"
                value={email}
                onChange={e => { setEmail(e.target.value); setErr(""); }}
              />
            </div>
            <div className="modal-field">
              <input
                type="password"
                placeholder="password"
                value={pass}
                onChange={e => { setPass(e.target.value); setErr(""); }}
                onKeyDown={e => e.key === "Enter" && handleEnter()}
              />
            </div>

            {err && <p style={{ color:"#ef4444", fontSize:13, fontWeight:700, marginBottom:8 }}>{err}</p>}

            </div>

        </div>
      );

          id: editTarget ? editTarget.id : Date.now(),
          name: form.name.trim(),
          category: form.category,

          alat: form.alat.split(",").map(s=>s.trim()).filter(Boolean),
          bahan: form.bahan.split(",").map(s=>s.trim()).filter(Boolean),
          cara: form.cara.split("\n").map(s=>s.trim()).filter(Boolean)

          setDrinkList(drinkList.map(d => d.id === editTarget.id ? newDrink : d));

        setShowModal(false);
      };

      const handleDelete = (id) => {
        setDrinkList(drinkList.filter(d => d.id !== id));
        setDeleteConfirm(null);
      };

      return (
        <>
          <div className="admin-hero">
            <h1>ADMIN PANEL</h1>
          </div>
          <div className="admin-body">
            <div className="admin-toolbar">
              <div className="admin-toolbar-title">Kelola Resep Minuman</div>
              <button className="btn-add" onClick={openAdd}>+ Tambah Resep</button>
            </div>

            <table className="admin-table">
              <thead>
                <tr>
                  <th>Foto</th>
                  <th>Nama Minuman</th>
                  <th>Kategori</th>
                  <th>Rating</th>
                  <th>Aksi</th>
                </tr>
              </thead>
              <tbody>
                {drinkList.map(d => (
                  <tr key={d.id}>
                    <td><img src={d.img} alt={d.name} /></td>
                    <td>{d.name}</td>
                    <td>{d.category}</td>
                    <td>{"⭐".repeat(d.rating)}</td>
                    <td>
                      <button className="btn-edit" onClick={() => openEdit(d)}>✏ Edit</button>
                      <button className="btn-del" onClick={() => setDeleteConfirm(d.id)}>🗑 Hapus</button>
                    </td>
                  </tr>
                ))}
                {drinkList.length === 0 && (
                  <tr><td colSpan="5" style={{ textAlign:"center", color:"var(--gray)", padding:32 }}>Belum ada resep. Klik "+ Tambah Resep" untuk memulai.</td></tr>
                )}
              </tbody>
            </table>
          </div>

          {/* Modal Tambah/Edit */}
          {showModal && (
            <div className="modal-overlay" onClick={e => { if(e.target===e.currentTarget) setShowModal(false); }}>
              <div className="admin-modal-box">
                <button className="modal-close" onClick={() => setShowModal(false)}>✕</button>
                <div className="modal-title" style={{ fontSize:20, marginBottom:20 }}>
                  {editTarget ? "✏ Edit Resep" : "➕ Tambah Resep Baru"}
                </div>

                <div className="admin-form-row">
                  <label>Nama Minuman *</label>
                  <input type="text" placeholder="cth: Es Jeruk Peras" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} />
                </div>
                <div className="admin-form-row">
                  <label>Kategori</label>
                  <select value={form.category} onChange={e=>setForm({...form,category:e.target.value})}>
                    <option>Smoothies & Juices</option>
                    <option>Coffee & Tea</option>
                    <option>Mocktails</option>
                    <option>Milkshakes</option>
                  </select>
                </div>
                <div className="admin-form-row">
                  <label>URL Foto</label>
                  <input type="text" placeholder="https://..." value={form.img} onChange={e=>setForm({...form,img:e.target.value})} />
                  <div className="admin-form-hint">Kosongkan untuk menggunakan foto default</div>
                </div>
                <div className="admin-form-row">
                  <label>Deskripsi</label>
                  <textarea placeholder="Deskripsi singkat minuman..." value={form.desc} onChange={e=>setForm({...form,desc:e.target.value})} />
                </div>
                <div className="admin-form-row">
                  <label>Alat</label>
                  <input type="text" placeholder="Pisau, Blender, Gelas saji" value={form.alat} onChange={e=>setForm({...form,alat:e.target.value})} />
                  <div className="admin-form-hint">Pisahkan dengan koma</div>
                </div>
                <div className="admin-form-row">
                  <label>Bahan</label>
                  <textarea placeholder="1 buah mangga, 200 ml susu, ..." value={form.bahan} onChange={e=>setForm({...form,bahan:e.target.value})} />
                  <div className="admin-form-hint">Pisahkan dengan koma</div>
                </div>
                <div className="admin-form-row">
                  <label>Cara Membuat</label>
                  <textarea style={{ minHeight:100 }} placeholder={"Langkah 1...\nLangkah 2...\nLangkah 3..."} value={form.cara} onChange={e=>setForm({...form,cara:e.target.value})} />
                  <div className="admin-form-hint">Satu langkah per baris</div>
                </div>

                <button className="btn-enter" onClick={handleSave}>
                  {editTarget ? "Simpan Perubahan" : "Tambahkan Resep"}
                </button>
              </div>
            </div>
          )}

          {/* Konfirmasi hapus */}
          {deleteConfirm && (
            <div className="modal-overlay" onClick={() => setDeleteConfirm(null)}>
              <div className="modal-box" style={{ textAlign:"center" }} onClick={e=>e.stopPropagation()}>
                <div style={{ fontSize:40, marginBottom:12 }}>🗑</div>
                <div className="modal-title" style={{ fontSize:20 }}>Hapus Resep?</div>
                <p style={{ color:"var(--gray)", fontSize:14, fontWeight:600, marginBottom:24, lineHeight:1.6 }}>
                  Resep ini akan dihapus secara permanen.<br />Tindakan ini tidak bisa dibatalkan.
                </p>
                <div style={{ display:"flex", gap:12 }}>
                  <button onClick={() => setDeleteConfirm(null)} style={{ flex:1, padding:"11px", border:"2px solid #E5E7EB", borderRadius:12, fontFamily:"'Nunito',sans-serif", fontWeight:700, fontSize:14, cursor:"pointer", background:"none", color:"var(--dark)" }}>
                    Batal
                  </button>
                  <button onClick={() => handleDelete(deleteConfirm)} style={{ flex:1, padding:"11px", border:"none", borderRadius:12, fontFamily:"'Nunito',sans-serif", fontWeight:700, fontSize:14, cursor:"pointer", background:"#ef4444", color:"white" }}>
                    Ya, Hapus
                  </button>
                </div>
              </div>
            </div>
          )}
        </>
      );
    }

    /* ====================================================
       APP ROOT
    ==================================================== */
    function App() {
      const [page, setPage] = useState("home");
      const [selectedDrink, setSelectedDrink] = useState(null);
      const [showLogin, setShowLogin] = useState(false);
      const [loggedIn, setLoggedIn] = useState(false);
      const [toast, setToast] = useState(null);

      const handleSearch = (drink) => {
        setSelectedDrink(drink);
        setPage("detail");
      };

      const handleLoginSuccess = () => {
        setShowLogin(false);
        setLoggedIn(true);
        setToast("✅ Login berhasil! Selamat datang!");
      };

      return (
        <>
          <Navbar
            page={page}
            setPage={setPage}
            onSearch={handleSearch}
            loggedIn={loggedIn}
            onLoginClick={() => setShowLogin(true)}
          />

          <main>
            {page === "home" && (
              <HomePage
                setPage={setPage}
                setSelectedDrink={setSelectedDrink}
                onLoginClick={() => setShowLogin(true)}
                loggedIn={loggedIn}
                toast={toast}
                setToast={setToast}
              />
            )}
            {page === "detail" && selectedDrink && (
              <DetailPage
                drink={selectedDrink}
                setPage={setPage}
                onLoginClick={() => setShowLogin(true)}
                loggedIn={loggedIn}
              />
            )}
            {page === "kategori" && (
              <KategoriPage setPage={setPage} setSelectedDrink={setSelectedDrink} />
            )}
            {page === "about" && <AboutPage />}
            {page === "admin" && (
              <AdminPage loggedIn={loggedIn} onLoginClick={() => setShowLogin(true)} />
            )}
          </main>

          <footer className="footer">
            &copy; 2025 <span>FreshDrink</span> — Iklil Baihaqi · IX RPL 1 · Project Akhir
          </footer>

          {showLogin && (
            <LoginModal
              onClose={() => setShowLogin(false)}
              onSuccess={handleLoginSuccess}
            />
          )}

          {toast && <Toast msg={toast} onDone={() => setToast(null)} />}
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
